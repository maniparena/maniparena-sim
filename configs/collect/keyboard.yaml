enable_cameras: true
num_envs: 1
num_demos: 10
step_hz: 20
max_steps: 0
working_path: "~/maniparena_output/recordings/"
format: "bimanual_lerobot"
async_writer: false
stager_chunk_size: 32
teleop_config:
  position_scale: 0.02
  rotation_scale: 0.2
stream_viewports:
  width: 640
  height: 480
  position_x: 1280
  position_y: 0
  main_camera: head_camera
  cameras:
    - left_wrist_camera
    - right_wrist_camera
