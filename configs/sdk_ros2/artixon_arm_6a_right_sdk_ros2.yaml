# ArtiXon Arm-6A single right G-jaw ROS2 SDK.
robot:
  type: artixon_arm_6a_right

enable_cameras: true
simulation:
  physics_dt: 0.008333333333333333
  decimation: 6
  render_interval: 2

viewer_cfg:
  origin_type: world
  eye: [0.7, 0.8, 0.7]
  lookat: [0.3, 0.2, 0.2]

ros:
  use_sim_time: true
  control_rate_hz: 20.0
  arm_control: ee
  # std_srvs/SetBool: data true -> ee, false -> joint. Replies with the active mode in `message`.
  mode_service: /set_arm_control_mode
