# QUANTA_X1 SDK ROS2 (2D lidar and cameras enabled). No data recording.

# Kit Perspective: static opening view (world-frame metres). Does not follow the robot.
# Robot spawn is about (-0.72, -0.26, 0).
viewer_cfg:
  origin_type: world
  eye: [0, 1.74, 1.6]
  lookat: [-0.52, -0.26, 0.8]

# Keyboard chassis sensitivity (summed with /chassis/cmd_vel).
keyboard:
  linear_velocity: 0.5
  angular_velocity: 2.0

# ROS2 bridge.
ros:
  use_sim_time: true
  control_rate_hz: 10.0
  cmd_vel_timeout_s: 0.25
  # ee: /left_arm_cartesian_controller/pose_cmd
  # joint: /left_arm_joint_controller/commands
  arm_control: ee
