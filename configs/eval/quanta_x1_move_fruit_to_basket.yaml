# Closed-loop eval for move_fruit_to_basket (scripts/eval.py --robot quanta_x1 --task move_fruit_to_basket).
# Only settings that differ from the code defaults, or that you are expected to tune, are listed.
num_episodes: 10
# Per-episode step limit (timeout -> reset and count the episode as failed). The
# collected demonstrations are limited to 7200 steps; use 100~300 first to check resets.
max_steps: 3000
enable_recording: true

# Third-person camera for --video.
viewer_cfg:
  eye: [-1.2, 0.0, 2.2]
  lookat: [1.5, 0.0, 0.5]
video_recorder:
  backend_source: renderer
  window_width: 1280
  window_height: 720

policy_config:
  model_address: "localhost"
  model_port: 8000
  instruction: "Navigate to the source fruit table, grasp the correct fruit on the table, navigate to the destination basket table, place the fruit in the basket, and retract the arm safely."
  action_horizon: 32
  action_chunk_length: 32
  interpolation_multiplier: 1.5

# Optional: pin the sampled pool objects / seed (default: random per process).
# scene_options:
#   seed: 0
#   fruit: e.g. apple_01, basket: e.g. basket_01 (names in assets/mobile_manip/pools.json)
