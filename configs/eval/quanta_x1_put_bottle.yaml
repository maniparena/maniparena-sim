enable_cameras: true
enable_recording: true
num_envs: 1
num_episodes: 10
# Per-episode hard limit in eval.py (timeout -> reset + count 1 episode).
# 2000 ≈ long mobile-manip episode; use 100~300 first to verify reset works.
max_steps: 3000
working_path: "~/maniparena_output/eval/"
# Third-person perspective for --video (world-frame eye / lookat in metres).
viewer_cfg:
  origin_type: world
  eye: [-1.0, 1.8, 1.5]
  lookat: [0.55, -0.85, 0.55]
# Fixed perspective recorder (independent of Kit viewport drag).
video_recorder:
  backend_source: renderer
  window_width: 1280
  window_height: 720
# One mp4 per eval episode (--video); use video_mode: step for fixed step clips.
video_mode: episode

policy_config:
  model_address: "localhost"
  model_port: 8000
  instruction: "Navigate to the source table, grasp the bottle on the table, navigate to the wooden shelf, place the bottle on the shelf, and retract the arm safely."
  action_horizon: 32
  action_chunk_length: 32
  interpolation_multiplier: 1.5
  # follow* is already init-relative on the Wall-X wire; keep false.
  ee_pose_normalize: false
  pos_gain: 1.0
  rot_gain: 1.0
