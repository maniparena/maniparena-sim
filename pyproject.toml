[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maniparena_sim"
version = "0.1.0"
description = "Bimanual data collection and validation runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "PyYAML",
  "av",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maniparena_sim*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
