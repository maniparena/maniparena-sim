[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maniparena_sim"
version = "0.1.0"
description = "EX001 / bimanual data collection and validation runtime."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "PyYAML",
  "av",
  "pyarrow>=14",
  "msgpack",
  "msgpack-numpy",
  "websockets",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maniparena_sim*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
