[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maniparena_sim"
version = "0.1.0"
description = "QUANTA_X1 / bimanual data collection and validation runtime."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy>=1.11",
  "osqp>=1.0,<2",
  "PyYAML",
  "av",
  "pyarrow>=14",
  "msgpack",
  "msgpack-numpy",
  "websockets",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["maniparena_sim*"]

[tool.setuptools.package-data]
maniparena_sim = ["kinematics/data/*.json"]
